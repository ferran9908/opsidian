# Every push to main is checked, and when the Mac app changed it becomes the new release:
# version <major>.<minor>.<run number> from apps/desktop/package.json, signed, notarised,
# published on GitHub, and picked up by installed copies and ferran.sh/opsidian.
# See docs/release.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order. A running release is never cancelled, so a half-published
# version cannot be left behind.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # pnpm first: setup-node caches the pnpm store, and looks for pnpm to do it. The version
      # comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      iphone: ${{ steps.filter.outputs.iphone }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mac:
              - 'apps/desktop/**'
              - 'apps/host/src/**'
              - 'packages/**'
              - 'design/logo/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/release.yml'
            iphone:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'scripts/build-mobile-editor.mjs'
              - 'scripts/ship-iphone.sh'
              - 'pnpm-lock.yaml'
              - '.github/workflows/release.yml'

  mac:
    name: Mac app
    needs: [check, changes]
    # A manual run always releases; a push only when something the app is built from changed.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # pnpm first: setup-node caches the pnpm store, and looks for pnpm to do it. The version
      # comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Stamp the version
        id: version
        working-directory: apps/desktop
        # The run number only grows, so every release is newer than the last, which updates need.
        # The stamp is never committed: package.json keeps <major>.<minor>.0.
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="$base.${{ github.run_number }}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Opsidian $version"

      - name: Signing secrets are set
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Run scripts/ci-secrets.sh on the Mac that makes releases."
            exit 1
          fi

      - name: Notarisation key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarise and publish
        working-directory: apps/desktop
        env:
          # electron-builder imports the certificate into a temporary keychain by itself.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build.mjs && node scripts/package.mjs --publish

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  iphone:
    name: iPhone app
    needs: [check, changes]
    # A manual run always ships; a push only when something the app is built from changed.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.iphone == 'true'
    # Linux, as T3 Code does: the fingerprint must be worked out the same way as on EAS.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Expo token is set
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # Until EAS is set up, the iPhone app is skipped with a note instead of failing every run.
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::No EXPO_TOKEN secret, so the iPhone app was not shipped. See docs/release.md, iPhone."
          fi
      - if: steps.expo.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.expo.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.expo.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.expo.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The editor's offline page is generated, not committed; an over-the-air update carries it.
      - if: steps.expo.outputs.ready == 'true'
        run: pnpm build:mobile-editor
      - name: Send over the air, or build for TestFlight
        if: steps.expo.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: scripts/ship-iphone.sh
